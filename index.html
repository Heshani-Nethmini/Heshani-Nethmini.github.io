<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heshani Nethmini — QA Engineering & Network Architecture</title>
<meta name="description" content="Creative Portfolio of Heshani Nethmini, QA Engineering and Network Architecture enthusiast specializing in test automation, Selenium, and network configurations.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --bg:#030712;
    --bg-card:#0b1329;
    --card-border:rgba(139, 92, 246, 0.25);
    --primary:#8b5cf6;
    --primary-glow:rgba(139, 92, 246, 0.35);
    --accent:#06b6d4;
    --accent-glow:rgba(6, 182, 212, 0.3);
    --success:#10b981;
    --text:#f3f4f6;
    --muted:#9ca3af;
    --font-heading:'Outfit', sans-serif;
    --font-body:'Plus Jakarta Sans', sans-serif;
    --font-mono:'Fira Code', monospace;
  }

  *{margin:0; padding:0; box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.7;
    overflow-x:hidden;
  }
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--primary); color:#fff;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:4px;}

  .wrap{max-width:1160px; margin:0 auto; padding:0 32px; position:relative; z-index:2;}

  /* ICT Network Grid & Tech Nodes Background */
  .bg-grid{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image: 
      linear-gradient(to right, rgba(139, 92, 246, 0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(6, 182, 212, 0.04) 1px, transparent 1px);
    background-size: 50px 50px;
  }
  .tech-node {
    position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 1; opacity: 0.35;
  }
  .node-1 { width: 250px; height: 250px; background: var(--primary); top: 40px; left: -50px; }
  .node-2 { width: 300px; height: 300px; background: var(--accent); bottom: 50px; right: -50px; opacity: 0.25; }

  /* Navigation Bar */
  header.nav{
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:rgba(3, 7, 18, 0.85); backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .nav-inner{max-width:1160px; margin:0 auto; padding:20px 32px; display:flex; align-items:center; justify-content:space-between;}
  .logo{font-family:var(--font-heading); font-weight:800; font-size:22px; letter-spacing:-0.5px;}
  .logo span{color:var(--primary); text-shadow:0 0 15px var(--primary-glow);}
  
  nav.links{
    display:none; align-items:center; gap:24px; font-size:14px; font-weight:500;
    background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08);
    padding:8px 24px; border-radius:40px; backdrop-filter:blur(10px);
  }
  nav.links a{color:var(--muted); transition:color 0.3s ease, transform 0.2s ease;}
  nav.links a:hover{color:var(--text); transform:translateY(-1px);}
  
  .nav-cta{
    background:linear-gradient(135deg, var(--primary), var(--accent));
    color:#fff !important; padding:10px 22px; border-radius:30px; font-weight:600 !important; font-size:14px;
    box-shadow:0 0 20px var(--primary-glow); transition:transform 0.3s ease, box-shadow 0.3s ease;
  }
  .nav-cta:hover{transform:translateY(-2px); box-shadow:0 0 30px var(--accent-glow);}
  @media (min-width:901px){ nav.links{display:flex;} }

  section{position:relative; z-index:2; padding:110px 0;}
  
  .section-tag{
    font-family:var(--font-mono); font-size:13px; letter-spacing:0.15em; text-transform:uppercase;
    color:var(--accent); display:inline-flex; align-items:center; gap:8px; margin-bottom:12px;
    background:rgba(6, 182, 212, 0.1); padding:6px 14px; border-radius:20px; border:1px solid rgba(6, 182, 212, 0.2);
  }
  h2.section-title{
    font-family:var(--font-heading); font-size:clamp(30px, 4vw, 42px); font-weight:800; 
    letter-spacing:-1px; margin-bottom:48px; background:linear-gradient(to right, #fff, var(--muted));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  /* Hero Section */
  .hero{padding:180px 0 100px;}
  .hero-grid{display:flex; flex-direction:column; gap:50px;}
  @media (min-width:850px){
    .hero-grid{flex-direction:row; align-items:center; justify-content:space-between;}
    .hero-content{flex:1; max-width:640px;}
  }
  .hero-badge{
    display:inline-flex; align-items:center; gap:8px; background:rgba(16, 185, 129, 0.1);
    border:1px solid rgba(16, 185, 129, 0.3); color:var(--success); padding:6px 16px; border-radius:30px;
    font-family:var(--font-mono); font-size:12px; margin-bottom:20px;
  }
  .hero-badge .pulse{width:8px; height:8px; background:var(--success); border-radius:50%; box-shadow:0 0 10px var(--success); animation:pulse 2s infinite;}
